# Nginx Configuration for gemostone.com (Next.js Application)
# File location on VPS: /etc/nginx/sites-available/gemostone.com

server {
    server_name gemostone.com www.gemostone.com;

    # Gzip compression for high performance
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Serve static assets directly from Next.js build output
    location /_next/static/ {
        alias /Production/AstroVedansh/GemoStone_Frontend_WebApp/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Serve public static files (images, favicon, assets)
    location /public/ {
        alias /Production/AstroVedansh/GemoStone_Frontend_WebApp/public/;
        expires 30d;
        access_log off;
    }

    # Reverse proxy to Next.js PM2 server running on port 3000
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/gemostone.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gemostone.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.gemostone.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = gemostone.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gemostone.com www.gemostone.com;
    return 404; # managed by Certbot




}
